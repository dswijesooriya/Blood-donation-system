# ============================================================
# Nginx config INSIDE the frontend container
# ============================================================
# This is different from the host-level Nginx config!
#   - Host Nginx: routes external traffic to containers
#   - This config: handles SPA routing inside the container
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- GZIP COMPRESSION ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/javascript application/json;

    # ---------- CACHING FOR ASSETS ----------
    # Long cache for hashed files (Vite adds hashes to filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- SPA ROUTING ----------
    # Any request that doesn't match a real file goes to index.html
    # This makes /donor/dashboard, /login, etc. work on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- SECURITY HEADERS ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}