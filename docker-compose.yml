# ============================================================
# BloodLife — Docker Compose Configuration
# ============================================================
# Runs both backend and frontend containers together.
#
# Usage:
#   docker compose up -d --build   # Build & start
#   docker compose down            # Stop & remove
#   docker compose logs -f         # View live logs
# ============================================================

services:
  # ============================================================
  # BACKEND — Node.js + Express API (port 5000)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bloodlife-backend
    restart: unless-stopped
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    networks:
      - bloodlife-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================
  # FRONTEND — React + Nginx (port 80 inside container)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time variable for Vite
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: bloodlife-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - bloodlife-network
    depends_on:
      - backend

# ============================================================
# NETWORKS
# ============================================================
networks:
  bloodlife-network:
    driver: bridge